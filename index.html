<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS fetch API</title>
</head>
<body style="background-color: rgb(211, 211, 211);">

    <div style="background-color: azure; border-style: solid; border-color: blue; padding: 1rem;">
        <p id="demo"></p>
    </div>
    
    <div style="background-color: azure; border-style: solid; border-color: blue; margin-top: 1rem; padding: 1rem;">
    <p id="status">
        <ul id="response-properties">
            <li id="item1"></li>
            <li id="item2"></li>
            <li id="item3"></li>
            <li id="item4"></li>
        </ul>
    </p>
    </div>


    <script>

        loadfile("data.txt");

        async function loadfile(file) {

            // PROMISE
            // ti prometto che ti restituisco un file...
            // ma mi serve tempo! devi pazientare: 
            // await fetch() restituisce una promise che viene
            // mantenuta restituendo l'oggetto response
            const response = await fetch(file);

            // PROMISE
            // response.text() restituisce una PROMISE
            // => serve await che permette di mantenere la promessa salvando nella variabile .text()
            // le altre proprietä vengono soddisfatte immediatamente
            testo = await response.text();

            // TEST in console
            console.log(testo); // -> vedi sopra il motivo
            console.log(response.ok);
            console.log(response.status);
            console.log(response.statusText);
            console.log(response.url);

            // visualizzo nella pagina il contenuto del file
            document.getElementById("demo").innerText=testo;

            // visualizzo anche le altre proprietá della response
            document.getElementById("item1").innerText=response.ok;
            document.getElementById("item2").innerText=response.status;
            document.getElementById("item3").innerText=response.statusText;
            document.getElementById("item4").innerText=response.url;
            

        }
    </script>
</body>
</html>
